name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Red-DiscordBot's supported floor
          python-version: '3.11'
      - name: Byte-compile the cog
        run: python -m compileall -q livetennis
      - name: Validate repo and cog info.json
        run: python -c "import json; [json.load(open(f)) for f in ('info.json', 'livetennis/info.json')]"
      - name: Truth-pin check
        run: sh scripts/truthcheck.sh
